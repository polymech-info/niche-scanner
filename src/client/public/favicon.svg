<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Terminal window body -->
  <rect x="16" y="12" width="88" height="64" rx="10" fill="#1a1d27" stroke="#6366f1" stroke-width="3"/>

  <!-- Title bar dots -->
  <circle cx="32" cy="26" r="4" fill="#ef4444"/>
  <circle cx="44" cy="26" r="4" fill="#eab308"/>
  <circle cx="56" cy="26" r="4" fill="#22c55e"/>

  <!-- Terminal prompt line 1 -->
  <text x="30" y="50" font-family="monospace" font-size="14" font-weight="bold" fill="#22c55e">$</text>
  <text x="42" y="50" font-family="monospace" font-size="14" fill="#e5e7eb">runny</text>

  <!-- Cursor blink -->
  <rect x="82" y="40" width="8" height="14" rx="1" fill="#6366f1">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Terminal prompt line 2 -->
  <text x="30" y="66" font-family="monospace" font-size="11" fill="#22c55e">></text>
  <rect x="40" y="58" width="24" height="8" rx="2" fill="#6366f1" opacity="0.3"/>

  <!-- Left leg -->
  <g>
    <!-- Thigh -->
    <line x1="42" y1="76" x2="32" y2="92" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
    <!-- Shin -->
    <line x1="32" y1="92" x2="22" y2="104" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
    <!-- Sneaker -->
    <path d="M14 103 Q14 99 22 99 L26 99 Q30 99 30 103 L30 107 Q30 110 26 110 L14 110 Q10 110 10 107 L10 106 Q10 103 14 103Z" fill="#6366f1"/>
    <line x1="14" y1="105" x2="28" y2="105" stroke="#1a1d27" stroke-width="1.5"/>
    <!-- Lace dots -->
    <circle cx="18" cy="102" r="1" fill="#e5e7eb"/>
    <circle cx="23" cy="102" r="1" fill="#e5e7eb"/>
  </g>

  <!-- Right leg (extended back, running pose) -->
  <g>
    <!-- Thigh -->
    <line x1="72" y1="76" x2="82" y2="88" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
    <!-- Shin -->
    <line x1="82" y1="88" x2="96" y2="96" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
    <!-- Sneaker -->
    <path d="M92 91 Q92 88 96 88 L104 88 Q110 88 110 92 L110 96 Q110 99 106 99 L96 99 Q92 99 92 96Z" fill="#6366f1"/>
    <line x1="94" y1="94" x2="108" y2="94" stroke="#1a1d27" stroke-width="1.5"/>
    <!-- Lace dots -->
    <circle cx="99" cy="91" r="1" fill="#e5e7eb"/>
    <circle cx="104" cy="91" r="1" fill="#e5e7eb"/>
  </g>

  <!-- Motion lines -->
  <line x1="108" y1="30" x2="116" y2="28" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="110" y1="40" x2="118" y2="40" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="108" y1="50" x2="116" y2="52" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
